// ONEstore lifecycle order: listeners -> initialize -> load -> progress -> ready.
// https://onestore-dev.gitbook.io/dev/tools/web-sdk/lifecycle
async function startOneStore(sdk, hooks) {
  sdk.on('pause', () => hooks.pause());
  sdk.on('resume', event => { hooks.environment(event ?? {}); hooks.resume(); });
  sdk.on('exit', () => hooks.save());
  sdk.onBackPressed(() => hooks.back());
  const info = await sdk.initializeAsync();
  if (info?.err) {
    if (info.err !== 'Platform Not Supported') throw new Error(info.err);
    await hooks.loadGame();
    return 'browser';
  }
  hooks.environment(info ?? {});
  sdk.setLoadingProgress(0);
  await hooks.loadGame();
  sdk.setLoadingProgress(100);
  await sdk.startGameAsync();
  return 'onestore';
}

const nativeEnvironment={ringerSilent:false};
const main=document.querySelector('main');main.inert=true;
const hooks={pause(){},resume(){},save(){},back(){return false},
environment(info){
  if(typeof info.ringerSilent==='boolean')nativeEnvironment.ringerSilent=info.ringerSilent;
  if(info.safeArea){for(const edge of ['top','right','bottom','left']){
    const n=Number(info.safeArea[edge]);
    document.body.style['padding'+edge[0].toUpperCase()+edge.slice(1)]=Math.min(100,Math.max(0,Number.isFinite(n)?n:0))+'px';
  }}
},async loadGame(){
const ATTENDANCE_KEY='kts_attendance';
const DAILY_DEFAULTS={binSpeedMul:1,rejectDocRateMul:1,rejectDocScoreMul:1,comboCap:3,lifeRegenPerWave:0,gaugeChargeMul:1,scoreMul:1,binSizeTable:null};
const DAILY_MODIFIERS={1:{name:'월요병',en:'Monday blues',location:'office',binSpeedMul:1.15},2:{name:'반려의 날',en:'Rejected again',location:'office',rejectDocRateMul:2,rejectDocScoreMul:2},3:{name:'반환점',en:'Halfway there',location:'lounge',comboCap:4},4:{name:'탕비실 간식',en:'Snack break',location:'lounge',lifeRegenPerWave:1},5:{name:'불금',en:'Friday freedom',location:'office',gaugeChargeMul:2},6:{name:'주말 출근',en:'Weekend shift',location:'airport',scoreMul:1.5},0:{name:'출근 전야',en:'Easy Sunday',location:'airport',binSizeTable:[1,.9,.8,.7]}};
function workDate(now=new Date()){const d=new Date(now);d.setHours(d.getHours()-4);return d;}
function workDay(now=new Date()){const d=workDate(now);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dailyConfig(now=new Date()){return {...DAILY_DEFAULTS,...DAILY_MODIFIERS[workDate(now).getDay()]};}
const PROMOTIONS=[{days:0,ko:'인턴',en:'Intern'},{days:3,ko:'사원',en:'Associate',item:'mug'},{days:7,ko:'주임',en:'Senior',item:'bin'},{days:10,ko:'대리',en:'Assistant manager',item:'name'},{days:14,ko:'과장',en:'Manager',item:'plant'},{days:21,ko:'차장',en:'Deputy head',item:'paper'},{days:30,ko:'부장',en:'Head',item:'stamp'},{days:50,ko:'이사',en:'Director',item:'fireworks'}];
function emptyAttendance(){return {days:{},dailyBest:{},shownPromotions:[],equipped:{},nameplate:''};}
function loadAttendance(store){try{const a=JSON.parse(store?.getItem(ATTENDANCE_KEY));if(!a||typeof a!=='object')return emptyAttendance();const valid=k=>/^\d{4}-\d{2}-\d{2}$/.test(k);return {days:Object.fromEntries(Object.entries(a.days||{}).filter(([k,v])=>valid(k)&&['played','clear'].includes(v))),dailyBest:Object.fromEntries(Object.entries(a.dailyBest||{}).filter(([k,v])=>valid(k)&&Number.isSafeInteger(v)&&v>=0)),shownPromotions:Array.isArray(a.shownPromotions)?a.shownPromotions.filter(x=>PROMOTIONS.some(p=>p.days===x)):[],equipped:a.equipped&&typeof a.equipped==='object'?a.equipped:{},nameplate:typeof a.nameplate==='string'?Array.from(a.nameplate).slice(0,6).join(''):''};}catch{return emptyAttendance();}}
function persistAttendance(store,a){try{if(!store)return false;store.setItem(ATTENDANCE_KEY,JSON.stringify(a));return true;}catch{return false;}}
const attendanceCount=a=>Object.keys(a.days).length;
const rankFor=a=>PROMOTIONS.filter(p=>p.days<=attendanceCount(a)).at(-1);
const pendingPromotions=a=>PROMOTIONS.filter(p=>p.days>0&&p.days<=attendanceCount(a)&&!a.shownPromotions.includes(p.days));
function completeDaily(a,s){if(s.mode!=='daily'||!['won','lost'].includes(s.phase))return a;return {...a,days:{...a.days,[s.day]:a.days[s.day]==='clear'||s.phase==='won'?'clear':'played'},dailyBest:{...a.dailyBest,[s.day]:Math.max(a.dailyBest[s.day]||0,s.score)}};}
function stampFor(a,key,today){return a.days[key]||(key<today?'leave':'');}

const WAVE_SECONDS=18,WAVES=4,FLIGHT=.65,KEY='office-paper-toss-record-v1';
// 판정 범위를 그려진 구멍(반지름-7)+종이 반쪽에 맞춤. 테두리 위 착지는 rim으로 따로 알려 줌.
const HIT_INSET=3,RIM_PAD=14;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function goalFor(w){return [3,4,5,6][clamp(w,1,4)-1];}
function multiplier(combo){return combo>=5?3:combo>=3?2:combo>=2?1.5:1;}
function waveSpec(w){return [{radius:84,amplitude:0,speed:0},{radius:71.4,amplitude:0,speed:0},{radius:58.8,amplitude:72,speed:Math.PI*2/2.5},{radius:46.2,amplitude:150,speed:Math.PI*2/1.5}][clamp(w,1,4)-1];}
function initial(){return {location:'office',phase:'ready',wave:1,time:0,motion:0,lives:3,score:0,hits:0,misses:0,combo:0,bestCombo:0,jump:0,jumpClock:0,charge:0,celebrate:0,bonuses:0,shots:0,waveHits:0,projectile:null,report:null,lastResult:null,resultSerial:0};}
function bin(s){const spec=waveSpec(s.wave);return {x:300+Math.sin(s.motion)*spec.amplitude,y:310+(s.wave===4?Math.sin(s.motion*.65)*70:0)-(s.jump||0),radius:s.config?.binSizeTable?84*s.config.binSizeTable[s.wave-1]:spec.radius,ry:28};}
function releaseTarget(start,end,b){const dx=end.x-start.x,up=start.y-end.y;if(up<60||end.y<=b.y+36)return {x:end.x,y:end.y};return {x:clamp(end.x+dx*(end.y-b.y)/up,30,570),y:clamp(b.y,180,450)};}
function start(location='office',mode='free',now=new Date()){const config=mode==='daily'?dailyConfig(now):{...DAILY_DEFAULTS};return {...initial(),mode,day:workDay(now),config,location:mode==='daily'?config.location:(['office','lounge','airport'].includes(location)?location:'office'),phase:'playing'};}
function pause(s){return s.phase==='playing'?{...s,phase:'paused'}:s;}
function resume(s){return s.phase==='paused'?{...s,phase:'playing'}:s;}
function throwPaper(s,x,y=bin(s).y){if(s.phase!=='playing'||s.projectile||s.celebrate>0)return s;return {...s,shots:s.shots+1,projectile:{tx:clamp(x,30,570),ty:clamp(y,180,450),age:0,id:s.shots+1,rejected:((s.shots+1)%2===0)||(s.config?.rejectDocRateMul===2)}};}

function nextWave(s){if(s.phase!=='report')return s;if(s.wave===WAVES)return {...s,phase:'won'};return {...s,phase:'playing',wave:s.wave+1,lives:Math.min(3,s.lives+(s.config?.lifeRegenPerWave||0)),time:0,motion:0,jump:0,jumpClock:0,waveHits:0,celebrate:0,projectile:null,lastResult:null,report:null};}
function jumpAllowed(s){return s.phase==='playing'&&s.wave===4&&s.waveHits>=goalFor(4)-3&&s.waveHits<goalFor(4)&&!s.projectile&&s.celebrate<=0;}
function step(s,delta){if(s.phase!=='playing')return s;const dt=clamp(Number.isFinite(delta)?delta:0,0,.05);let n={...s,time:s.time+dt,motion:s.motion+dt*waveSpec(s.wave).speed*(s.config?.binSpeedMul||1)*(s.celebrate>0?0:1),celebrate:Math.max(0,s.celebrate-dt)};if(jumpAllowed(s)){n.jumpClock=(s.jumpClock||0)+dt;n.jump=Math.sin(Math.PI*Math.min(1,(n.jumpClock%1.6)/.5))*55;if(n.jumpClock%1.6>=.5)n.jump=0;}if(s.projectile){n.projectile={...s.projectile,age:s.projectile.age+dt};if(n.projectile.age>=FLIGHT){const b=bin(n),dx=n.projectile.tx-b.x,dy=n.projectile.ty-b.y,hit=(dx/(b.radius-HIT_INSET))**2+(dy/25)**2<=1,rim=!hit&&(dx/(b.radius+RIM_PAD))**2+(dy/36)**2<=1,perfect=hit&&Math.abs(dx)<b.radius*.25;const combo=hit?n.combo+1:0;n={...n,projectile:null,combo,bestCombo:Math.max(n.bestCombo,combo),hits:n.hits+(hit?1:0),waveHits:n.waveHits+(hit?1:0),misses:n.misses+(hit?0:1),lives:n.lives-(hit?0:1),score:n.score+(hit?Math.round((100*(combo>=7&&s.config?.comboCap===4?4:multiplier(combo))+(perfect?40:0))*(s.config?.scoreMul||1)*(s.projectile.rejected?(s.config?.rejectDocScoreMul||1):1)):0),charge:hit?clamp(n.charge+20*(s.config?.gaugeChargeMul||1),0,100):0,lastResult:{hit,rim,perfect,x:s.projectile.tx,y:n.projectile.ty,binX:b.x},resultSerial:n.resultSerial+1};}}
 if(n.charge>=100)n={...n,charge:0,score:n.score+Math.round(500*(s.config?.scoreMul||1)),bonuses:n.bonuses+1,celebrate:2.2};
 if(n.lives<=0)return {...n,phase:'lost',projectile:null};
 if(n.waveHits>=goalFor(n.wave)&&n.celebrate<=0)return {...n,phase:'report',projectile:null,report:{hits:n.waveHits,goal:goalFor(n.wave),score:n.score}};return n;}
function localDay(now=new Date()){return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;}
function readRecord(storage,day=localDay()){try{const r=JSON.parse(storage.getItem(KEY));return r&&r.day===day&&Number.isSafeInteger(r.best)&&r.best>=0?r.best:0}catch{return 0}}
function saveRecord(storage,score,day=localDay()){const best=Math.max(readRecord(storage,day),Number.isSafeInteger(score)&&score>=0?score:0);try{storage.setItem(KEY,JSON.stringify({day,best}));return {best,saved:true}}catch{return {best,saved:false}}}

// Original procedural art. All animation uses the game clock; no remote assets.
const palettes=[['#FFD08A','#FF9E5E',[0,0,0,0]],['#FF6B4A','#C44569',[255,140,66,.08]],['#4A4E69','#22223B',[58,58,92,.12]],['#12121F','#05050C',[26,26,46,.2]]];
const mix=(a,b,u)=>a+(b-a)*u;
function color(a,b,u){const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));return `rgb(${rgb(a).map((v,i)=>mix(v,rgb(b)[i],u)).join(',')})`;}
function createVisuals(ctx,reduced){let wave=1,from=1,age=2,clock=0,dust=[],notes=[],stampAge=9,cinema=0,cue=-1;const C=ctx;
 function text(s,x,y,size=12,col='#394e50'){C.fillStyle=col;C.font=`600 ${size}px system-ui`;C.textAlign='center';C.fillText(s,x,y)}
 function tick(dt,s,play){clock+=dt;if(wave!==s.wave){from=wave;wave=s.wave;age=0}const old=age;age+=dt;if(old<.7&&age>=.7)play('switch');dust=dust.map(p=>({...p,age:p.age+dt})).filter(p=>p.age<p.life);notes=notes.map(p=>({...p,age:p.age+dt})).filter(p=>p.age<1.5);stampAge+=dt;cinema=s.celebrate>0?2.2-s.celebrate:0;if(cinema){const k=cinema<.3?Math.floor(cinema/.07):cinema<.6?5:cinema<1.4?6+Math.min(3,Math.floor((cinema-.6)/.1)):cinema<1.8?10:11+Math.floor((cinema-1.8)/.08);if(k!==cue){cue=k;play(k<5?'tick':k===5?'bell':k<10?'switch':k===10?'stamp':'tick')}}else cue=-1;}
 function crumple(){for(let i=0;i<5;i++)dust.push({x:300,y:801,vx:(i-2)*35,vy:-80-i*7,age:0,life:.2,color:i%2?'#fff':'#bbb9ae'});}

function showBook(){bookPanel.replaceChildren();const count=attendanceCount(attendance),rank=rankFor(attendance),h=document.createElement('h2');h.textContent=label(`누적 출근 ${count}일 · ${rank.ko}`,`${count} workdays · ${rank.en}`);const nav=document.createElement('div');nav.append(makeButton('←',()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1);showBook();}),document.createTextNode(` ${calendarMonth.getFullYear()}-${calendarMonth.getMonth()+1} `),makeButton('→',()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1);showBook();}));const grid=document.createElement('div');grid.className='calendar';const year=calendarMonth.getFullYear(),month=calendarMonth.getMonth(),first=new Date(year,month,1).getDay(),total=new Date(year,month+1,0).getDate();for(const day of label('일 월 화 수 목 금 토','Su Mo Tu We Th Fr Sa').split(' ')){const cell=document.createElement('b');cell.textContent=day;grid.append(cell);}for(let i=0;i<first;i++)grid.append(document.createElement('span'));for(let d=1;d<=total;d++){const key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,status=stampFor(attendance,key,workDay()),cell=document.createElement('div');cell.className='day '+status+(key===workDay()?' today':'');cell.textContent=`${d} ${status==='clear'?label('칼퇴','Clear'):status==='played'?label('출근','Played'):status==='leave'?label('연차','Leave'):''}`;grid.append(cell);}bookPanel.append(h,nav,grid);for(const p of PROMOTIONS.filter(p=>p.days>0&&p.days<=count)){bookPanel.append(makeButton(`${attendance.equipped[p.item]?'✓ ':''}${cosmeticLabel(p.item)}`,()=>{attendance.equipped[p.item]=!attendance.equipped[p.item];storeAttendance();showBook();}));}if(count>=10){const input=document.createElement('input');input.setAttribute('aria-label',label('명패 이름, 최대 6자','Nameplate, 6 characters'));input.value=attendance.nameplate;input.oninput=()=>{attendance.nameplate=Array.from(input.value).slice(0,6).join('');input.value=attendance.nameplate;storeAttendance();};bookPanel.append(input);}const notice=document.createElement('p');notice.textContent=attendanceSaved?label('이 기기에만 저장됩니다.','Saved only on this device.'):label('저장할 수 없습니다. 이번 방문에서만 유지됩니다.','Storage unavailable. Kept for this visit only.');bookPanel.append(notice,makeButton(label('닫기','Close'),()=>bookPanel.close()));if(!bookPanel.open)bookPanel.showModal();}
bookButton.onclick=()=>{if(s.phase==='playing')setPause();showBook();};
function drawCosmetics(b){const count=attendanceCount(attendance),e=attendance.equipped;ctx.save();if(e.bin&&count>=7){ctx.strokeStyle='#e67c39';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(b.x,b.y,b.radius+4,28,0,0,Math.PI*2);ctx.stroke();}if(e.mug&&count>=3){ctx.fillStyle='#66534d';ctx.font='25px system-ui';ctx.fillText('🐱',483,820);}if(e.plant&&count>=14){ctx.fillStyle='#ad7655';ctx.fillRect(180,810,28,28);ctx.fillStyle='#4c8d61';ctx.font='30px system-ui';ctx.fillText(count>=30?'✿':count>=21?'♣':'🌱',194,811);}ctx.fillStyle='#f8e9bf';ctx.fillRect(190,850,220,36);ctx.strokeStyle=e.stamp&&count>=30?'#d6ab3c':'#97785a';ctx.strokeRect(190,850,220,36);ctx.fillStyle='#574c40';ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText(`${label(rankFor(attendance).ko,rankFor(attendance).en)} ${e.name&&count>=10?attendance.nameplate:''}`,300,874);if(e.fireworks&&count>=50&&s.celebrate>0&&!reduced){const u=(2.2-s.celebrate)/2.2;for(let i=0;i<16;i++){const a=i*Math.PI/8;ellipse(300+Math.cos(a)*u*180,130+Math.sin(a)*u*90,3,3,'#e5b63d');}}ctx.restore();}
const frameTimes=[];if(new URLSearchParams(location.search).has('qa'))Object.defineProperty(window,'officeQA',{get:()=>({state:structuredClone(s),frameTimes:[...frameTimes]})});
function frame(now){if(last&&frameTimes.length<2400)frameTimes.push(now-last);const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(cardRemaining>0&&!document.hidden&&dailyPanel.open){cardRemaining-=dt;if(cardRemaining<=0){dailyPanel.close();reset('daily');}}if(s.phase==='playing'){const prev=s;s=step(s,dt);if(s.resultSerial!==prev.resultSerial){const r=s.lastResult;fx.push({...r,age:0});if(fx.length>8)fx.shift();sound(r.hit?'hit':'miss');haptics.play(r.hit?'hit':'miss');announce(r.hit?r.perfect?t().perfect:t().hit:`${r.rim?t().rim:t().miss} · ${t().left} ${Math.max(0,s.lives)}`)}if(prev.celebrate>.8&&s.celebrate<=.8)haptics.play('clock');if(s.bonuses>prev.bonuses){announce(language==='ko'?'칼퇴 확정! +500':'CLOCK OUT! +500');sound(theme().id==='airport'?'theme':'hit')}if(s.phase!==prev.phase){if(s.phase==='report')visuals.report();save();aim=null;sound('hit')}render()}visuals.tick(s.phase==='paused'?0:dt,s,theme().id==='office'?sound:()=>{});if(ambientFilter)ambientFilter.frequency.value=theme().ambient||500;if(ambientGain&&audio)ambientGain.gain.setTargetAtTime(s.phase==='playing'&&!muted&&!nativeEnvironment.ringerSilent&&theme().ambient? (theme().id==='lounge'?.015:.009):0,audio.currentTime,.2);fx=fx.map(f=>({...f,age:f.age+dt})).filter(f=>f.age<.8);if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('#toast').textContent=''}draw();requestAnimationFrame(frame)}render();requestAnimationFrame(frame);

Object.assign(hooks,{
 pause(){setPause();audio?.suspend().catch(()=>{});},
 resume(){setPause();},
 save(){setPause();save();audio?.suspend().catch(()=>{});},
 back(){if(s.phase==='playing'){setPause();return true;}return false;}
});
}};
try{
 const {createSDK}=await import('https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js');
 const mode=await startOneStore(createSDK(),hooks);
 document.documentElement.dataset.onestoreMode=mode;
 main.inert=false;
}catch{
 const error=document.createElement('section');error.setAttribute('role','alert');
 error.style.cssText='position:fixed;inset:0;z-index:999;background:#143436;color:#fff2d7;padding:32px;text-align:center';
 const message=document.createElement('p');message.textContent='게임을 불러오지 못했습니다. 다시 시도해 주세요. / Unable to load the game.';
 const retry=document.createElement('button');retry.textContent='다시 시도 / Retry';retry.onclick=()=>location.reload();
 error.append(message,retry);document.body.append(error);
}
